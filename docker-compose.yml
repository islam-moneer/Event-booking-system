services:
  postgres:
    image: postgres:17-alpine
    container_name: ebs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebs
      POSTGRES_PASSWORD: ebs
      POSTGRES_DB: ebs_dev
    ports:
      # 5433 on the host: 5432 is commonly already taken by a local Postgres
      - '5433:5432'
    volumes:
      - ebs-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ebs -d ebs_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ebs-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ebs-pgdata:
